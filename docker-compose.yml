version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: mrs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mrs_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
    container_name: mrs_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mrs_db?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PEPPER_SECRET=${PEPPER_SECRET}
    depends_on:
      - postgres
    ports:
      - '8000:8000'
volumes:
  postgres_data:
